name: Build and publish releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: version
        name: Read and validate package version
        shell: python {0}
        run: |
          import json
          import os
          import tomllib

          with open("src-tauri/Cargo.toml", "rb") as manifest_file:
              version = tomllib.load(manifest_file)["package"]["version"]

          with open("src-tauri/tauri.conf.json", encoding="utf-8") as config_file:
              config_version = json.load(config_file)["version"]

          if version != config_version:
              raise SystemExit(
                  f"Version mismatch: Cargo.toml has {version}, "
                  f"tauri.conf.json has {config_version}"
              )

          tag = f"v{version}"
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              pushed_tag = os.environ["GITHUB_REF_NAME"]
              if pushed_tag != tag:
                  raise SystemExit(
                      f"Pushed tag {pushed_tag} does not match code version tag {tag}"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={tag}\n")

  windows:
    name: Windows installers and portable package
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build MSI and NSIS installers
        shell: pwsh
        run: |
          Push-Location .\src-tauri
          try {
            cargo tauri build --bundles msi,nsis -- --locked
          }
          finally {
            Pop-Location
          }

      - name: Package portable Windows build
        shell: pwsh
        run: .\tools\build-portable.ps1

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            dist/Kohlrausch-Konfig-${{ needs.version.outputs.version }}-portable.exe
            dist/Kohlrausch-Konfig-${{ needs.version.outputs.version }}-portable.zip

  linux:
    name: Linux packages
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libfuse2 \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            wget

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Debian and AppImage packages
        working-directory: src-tauri
        run: cargo tauri build --bundles deb,appimage -- --locked

      - name: Upload Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  publish:
    name: Publish GitHub release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kohlrausch Konfig ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: release-assets/**/*
          fail_on_unmatched_files: true
