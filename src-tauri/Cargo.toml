[package]
name = "kohlrausch"
version = "0.5.4"
description = "Kohlrausch Konfig macropad configuration"
authors = ["Emtypyie"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
serialport = { version = "4.10.1", default-features = false }
rfd = { version = "0.15.4", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_IO"] }
