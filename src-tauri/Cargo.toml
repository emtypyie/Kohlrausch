[package]
name = "kohlrausch"
version = "1.2.0"
description = "Kohlrausch Konfig macropad configuration"
authors = ["Emtypyie"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10.9"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
serialport = { version = "4.10.1", default-features = false }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15.4", default-features = false, features = ["common-controls-v6"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15.4", default-features = false, features = ["gtk3"] }
